<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magic Format</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">M</div>
      <div class="brand-text">
        <strong>Magic Format</strong>
        <span>本地文档处理</span>
      </div>
      <nav class="tabs" role="tablist" aria-label="功能切换">
        <button class="tab" id="tabConvert" type="button" role="tab" aria-selected="true" aria-controls="viewConvert">转换</button>
        <button class="tab" id="tabReview" type="button" role="tab" aria-selected="false" aria-controls="viewReview">审查</button>
      </nav>
      <span class="connection" id="connectionStatus">正在检查本地服务</span>
      <button class="quiet-button" id="shutdownButton" type="button">退出程序</button>
    </header>

    <main class="workspace">
      <section class="converter" id="viewConvert" aria-labelledby="converterTitle">
        <div class="section-heading">
          <div>
            <h1 id="converterTitle">转换文档</h1>
            <p>选择文件，完成后下载排版文档和复核报告。</p>
          </div>
        </div>

        <label class="dropzone" id="dropzone" for="fileInput">
          <input id="fileInput" type="file" accept=".docx,.md" multiple>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14"/></svg>
          <strong>拖放文件到这里</strong>
          <span>或点击选择，可以一次处理多个文件</span>
        </label>
        <p class="format-note">支持 .docx 和 .md 文件，单个文件最大 100 MB</p>

        <div class="queue-header" id="queueHeader" hidden>
          <span id="queueSummary"></span>
          <button class="text-button" id="clearButton" type="button">清空列表</button>
        </div>
        <ol class="queue" id="queue" aria-live="polite"></ol>
        <button class="primary-button" id="convertButton" type="button" disabled>
          <span>开始转换</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>
        </button>
      </section>

      <section class="reviewer" id="viewReview" hidden aria-labelledby="reviewTitle">
        <div class="section-heading">
          <div>
            <h1 id="reviewTitle">审查文档</h1>
            <p>上传一份 .docx，按模板打分并给出问题清单与整改建议。</p>
          </div>
        </div>

        <label class="dropzone review-dropzone" id="reviewDropzone" for="reviewInput">
          <input id="reviewInput" type="file" accept=".docx">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14"/></svg>
          <strong>拖放文件到这里</strong>
          <span>或点击选择一份文档</span>
        </label>
        <p class="format-note">支持 .docx 单文件，最大 100 MB</p>
        <p class="review-selection" id="reviewSelection" hidden></p>
        <p class="review-error" id="reviewError" hidden></p>

        <button class="primary-button" id="reviewButton" type="button" disabled>
          <span>开始审查</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>
        </button>

        <div class="review-result" id="reviewResult" hidden></div>
      </section>
    </main>

    <footer>
      <span id="versionText">正在读取版本</span>
      <span>本地运行</span>
    </footer>
  </div>
  <script src="/app.js"></script>
</body>
</html>
